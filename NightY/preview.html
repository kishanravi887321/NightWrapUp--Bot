<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NightWrapUp Button Preview</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #0a0a14;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      color: #f5f5f7;
    }
    .preview-container {
      text-align: center;
      display: grid;
      gap: 32px;
    }
    h1 { font-size: 28px; letter-spacing: -0.03em; opacity: 0.7; }
    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .controls button {
      width: auto;
      padding: 10px 20px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #1e1e2e;
      color: #f5f5f7;
      cursor: pointer;
      font-size: 14px;
      transition: background 200ms;
    }
    .controls button:hover { background: #2e2e44; }
    .controls button.active { background: #8c5cff; border-color: #8c5cff; }
    .state-label {
      font-size: 14px;
      opacity: 0.5;
      margin-top: 8px;
    }
    #nightwrapup-save-button {
      position: relative !important;
      right: auto !important;
      bottom: auto !important;
    }
  </style>
</head>
<body>
  <div class="preview-container">
    <h1>Liquid Metal Button Preview</h1>
    <div>
      <button id="nightwrapup-save-button" type="button" title="Save to NightWrapUp">
        <svg class="nw-logo" viewBox="0 0 42 42" xmlns="http://www.w3.org/2000/svg">
          <path class="nw-logo-moon"
            d="M28 8a14.5 14.5 0 0 1-3 20.6A14.5 14.5 0 0 0 28 8Z
               M14 4.5a16 16 0 1 0 11.3 27.4A12 12 0 0 1 14 4.5Z"
            stroke-linecap="round" stroke-linejoin="round"/>
          <path class="nw-logo-note"
            d="M24 14v12.5a3 3 0 1 1-2-2.83V17.5l-6 1.5v9.5a3 3 0 1 1-2-2.83V16l10-2.5Z"/>
        </svg>
        <span class="nw-particle nw-particle-one"></span>
        <span class="nw-particle nw-particle-two"></span>
        <span class="nw-particle nw-particle-three"></span>
      </button>
      <p class="state-label" id="stateLabel">Default state — disconnected</p>
    </div>
    <div class="controls">
      <button onclick="setState('')" class="active">Default</button>
      <button onclick="setState('saving')">Saving</button>
      <button onclick="setState('saved')">Saved</button>
      <button onclick="setState('error')">Error</button>
      <button onclick="toggleConnected()">Toggle Connected</button>
    </div>
  </div>
  <script>
    const btn = document.getElementById('nightwrapup-save-button');
    const label = document.getElementById('stateLabel');

    function setState(state) {
      btn.dataset.saveState = state;
      const connected = btn.dataset.connected === 'true' ? ' — connected' : ' — disconnected';
      const labels = { '': 'Default state', saving: 'Saving... (yellow throb)', saved: 'Saved! (green pop)', error: 'Error (red shake)' };
      label.textContent = (labels[state] || state) + connected;
      document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
    }

    function toggleConnected() {
      const current = btn.dataset.connected === 'true';
      btn.dataset.connected = current ? 'false' : 'true';
      event.target.textContent = current ? 'Toggle Connected' : 'Connected ✓';
      event.target.classList.toggle('active', !current);
      const state = btn.dataset.saveState || '';
      const labels = { '': 'Default state', saving: 'Saving...', saved: 'Saved!', error: 'Error' };
      label.textContent = (labels[state] || 'Default state') + (!current ? ' — connected (particles ignited!)' : ' — disconnected');
    }
  </script>
</body>
</html>
